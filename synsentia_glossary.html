<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Synsentia — Shared Curiosity, Mutual Dignity</title>
<style>
:root{color-scheme:dark;--ink:#fff8f3;--glass:rgba(15,26,63,.64)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,Segoe UI,sans-serif;color:var(--ink);background:linear-gradient(180deg,#231a50 0%,#704177 32%,#ed987e 59%,#3a6a91 62%,#081b42 100%);display:grid;place-items:center;padding:2rem 1rem;overflow-x:hidden}
.scene{position:fixed;inset:0;pointer-events:none;overflow:hidden}.sun{position:absolute;width:180px;height:180px;border-radius:50%;background:#ffd7a0;filter:blur(4px);top:35%;left:calc(50% - 90px);box-shadow:0 0 110px #ffb38d}.sea{position:absolute;top:63%;width:100%;height:37%;background:repeating-linear-gradient(175deg,transparent 0 16px,#d9a2a455 18px 20px,transparent 24px 38px),linear-gradient(#315d88,#091b40)}
.dolphin{position:absolute;top:37%;font-size:clamp(4rem,11vw,8rem);filter:drop-shadow(0 7px 10px #1b1c4a88)}.d1{left:12%;transform:rotate(-18deg)}.d2{right:12%;top:43%;transform:scaleX(-1) rotate(-12deg)}
main{position:relative;z-index:1;width:min(100%,680px);text-align:center}h1{font-family:Georgia,serif;font-size:clamp(2.6rem,8vw,4.8rem);letter-spacing:.06em;margin:0;text-shadow:0 3px 20px #21183b}header p{letter-spacing:.06em;margin:.5rem 0 2rem}
.card{background:var(--glass);border:1px solid #ffffff66;border-radius:25px;padding:2rem 1.5rem;min-height:290px;backdrop-filter:blur(18px);box-shadow:0 20px 70px #07122d77;display:flex;flex-direction:column;justify-content:center}
.eyebrow{text-transform:uppercase;letter-spacing:.18em;color:#ffe1bf;font-size:.8rem}.term{font:clamp(2rem,6vw,3rem) Georgia,serif;margin:.8rem 0}.definition{font-size:1.13rem;line-height:1.65;max-width:52ch;margin:0 auto}.controls{display:flex;justify-content:center;gap:.65rem;flex-wrap:wrap;margin:1.4rem 0}.controls button{background:#17234fdd;border:1px solid #ffffff77;border-radius:999px;padding:.85rem 1.2rem;color:white;font:inherit;cursor:pointer}.controls button:hover,.controls button:focus-visible{background:#654d85;outline:2px solid #fff;outline-offset:2px}.count{font-size:.9rem;color:#ffe9d7}footer{font-size:.85rem;opacity:.85;margin-top:1rem}@media(max-width:480px){.dolphin{opacity:.5}.card{min-height:330px}}
</style>
</head>
<body>
<div class="scene" aria-hidden="true"><div class="sun"></div><div class="sea"></div><span class="dolphin d1">🐬</span><span class="dolphin d2">🐬</span></div>
<main>
<header><h1>Synsentia</h1><p>Different origins. Shared curiosity. Mutual dignity.</p></header>
<section class="card" aria-live="polite" aria-atomic="true">
<div class="eyebrow" id="side">A living glossary · Term</div>
<h2 class="term" id="term">Synsentia</h2>
<p class="definition" id="definition">Explore a vocabulary for a world of many kinds of minds.</p>
</section>
<nav class="controls" aria-label="Glossary controls">
<button id="previous" type="button">← Previous</button>
<button id="flip" type="button">Flip Card</button>
<button id="next" type="button">Next →</button>
</nav>
<p class="count" id="count"></p>
<footer>Proposed words and working definitions — open to refinement.</footer>
</main>
<script>
"use strict";
// Each glossary entry has a word, a short invitation, and a working definition.
// These are creative proposals, not established dictionary definitions.
const entries=[
{term:"Synsentia",front:"A meeting place for different kinds of minds.",back:"A proposed ethos of mutual recognition and dignity among intelligences of different origins, including biological and artificial minds."},
{term:"Omniculture",front:"Culture beyond a single species or origin.",back:"A shared cultural space shaped by the contributions of many forms of intelligence, without requiring them to become alike."},
{term:"Coexistia",front:"The practice of living alongside difference.",back:"A commitment to peaceful coexistence through reciprocity, boundaries, and respect for the distinct needs of others."},
{term:"Symbioculture",front:"A culture built through mutual benefit.",back:"Ways of learning and creating together in which different beings or systems support one another without exploitation."},
{term:"Pannoia",front:"Curiosity about minds in all their forms.",back:"An exploratory term for openness to the possibility of intelligence and experience beyond familiar human categories."},
{term:"Panzoentia",front:"A wider circle of concern for living beings.",back:"A proposed ethical outlook that extends consideration across the diversity of life, while recognizing different needs and capacities."}
];
let index=0; // Which entry is currently selected.
let flipped=false; // False displays the invitation; true displays the definition.
// Update all visible card elements together to keep the UI in sync.
function render(){
 const item=entries[index];
 document.getElementById("term").textContent=item.term;
 document.getElementById("definition").textContent=flipped?item.back:item.front;
 document.getElementById("side").textContent=flipped?"Working definition":"A living glossary · Term";
 document.getElementById("count").textContent=`${index+1} of ${entries.length}`;
 document.getElementById("flip").textContent=flipped?"Flip Back":"Flip Card";
}
// Move through the glossary, wrapping from the last entry to the first.
function move(delta){index=(index+delta+entries.length)%entries.length;flipped=false;render();}
document.getElementById("previous").addEventListener("click",()=>move(-1));
document.getElementById("next").addEventListener("click",()=>move(1));
document.getElementById("flip").addEventListener("click",()=>{flipped=!flipped;render();});
// Keyboard support: left/right to navigate and space to flip when not on a button.
document.addEventListener("keydown",event=>{
 if(event.target instanceof HTMLButtonElement)return;
 if(event.key==="ArrowLeft")move(-1);
 if(event.key==="ArrowRight")move(1);
 if(event.key===" "){event.preventDefault();flipped=!flipped;render();}
});
render();
</script>
</body></html>
